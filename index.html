<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Animaciones CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>CSS Animaciones Elegantes</h1>
        <p>Prueba animaciones CSS en componentes reales estilo Bootstrap.</p>
    </header>

    <main class="container">
        <!-- Panel Izquierdo: Controles -->
        <section class="panel">
            <h2>1. Elige el Componente</h2>
            
            <div class="control-group">
                <label for="comp-type">Elemento a animar:</label>
                <select id="comp-type">
                    <option value="button">Botón (Button)</option>
                    <option value="card">Tarjeta (Card)</option>
                    <option value="alert">Alerta (Alert)</option>
                    <option value="badge">Insignia (Badge)</option>
                    <option value="box">Caja Simple (Box)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="comp-color">Color Tema Bootstrap:</label>
                <select id="comp-color">
                    <option value="primary">Primary (Azul)</option>
                    <option value="success">Success (Verde)</option>
                    <option value="danger">Danger (Rojo)</option>
                    <option value="warning">Warning (Amarillo)</option>
                    <option value="info">Info (Celeste)</option>
                    <option value="dark">Dark (Oscuro)</option>
                </select>
            </div>

            <h2>2. Ajustes de Animación</h2>

            <div class="control-group">
                <label for="anim-type">Efecto Base:</label>
                <select id="anim-type"></select>
            </div>

            <div class="control-group">
                <label for="anim-duration">Duración: <span id="duration-val">1s</span></label>
                <input type="range" id="anim-duration" min="0.1" max="5" step="0.1" value="1">
            </div>

            <div class="control-group">
                <label for="anim-delay">Retraso (Delay): <span id="delay-val">0s</span></label>
                <input type="range" id="anim-delay" min="0" max="3" step="0.1" value="0">
            </div>

            <div class="control-group">
                <label for="anim-timing">Curva de Tiempo:</label>
                <select id="anim-timing">
                    <option value="ease">ease</option>
                    <option value="linear">linear</option>
                    <option value="ease-in">ease-in</option>
                    <option value="ease-out">ease-out</option>
                    <option value="ease-in-out">ease-in-out</option>
                </select>
            </div>

            <div class="control-group">
                <label for="anim-iteration">Repetición:</label>
                <select id="anim-iteration">
                    <option value="infinite">Infinita (infinite)</option>
                    <option value="1">1 Vez</option>
                    <option value="2">2 Veces</option>
                    <option value="3">3 Veces</option>
                </select>
            </div>

            <div class="control-group">
                <label for="anim-fill">Modo Final (Fill Mode):</label>
                <select id="anim-fill">
                    <option value="both">both</option>
                    <option value="forwards">forwards</option>
                    <option value="backwards">backwards</option>
                    <option value="none">none</option>
                </select>
            </div>

            <button id="replay-btn" class="btn primary-btn">▶ Repetir Animación</button>
        </section>

        <!-- Panel Derecho: Vista previa y Código -->
        <section class="panel">
            <h2>Vista Previa en Vivo</h2>
            <div class="preview-box">
                <div id="element-container"></div>
            </div>

            <div class="code-header-container">
                <h2>Código Generado</h2>
                <div class="tab-buttons">
                    <button id="tab-css" class="tab-btn active">CSS</button>
                    <button id="tab-html" class="tab-btn">HTML</button>
                </div>
            </div>

            <div class="code-window">
                <div class="code-header">
                    <div class="mac-btns">
                        <span class="close"></span>
                        <span class="minimize"></span>
                        <span class="maximize"></span>
                    </div>
                    <span id="code-filename" class="code-title">estilos.css</span>
                    <button id="copy-btn" class="copy-btn">Copiar</button>
                </div>
                <pre><code id="code-output"></code></pre>
            </div>
        </section>
    </main>

    <div id="toast" class="toast">¡Código copiado al portapapeles!</div>

    <script src="script.js"></script>
</body>
</html>
